<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self' ws://localhost:*" />
    <title>Capturo — Pinned screenshot</title>
  </head>
  <body>
    <header>
      <span class="handle" title="Drag to move this pin">Pinned</span>
      <label for="opacity">Opacity</label>
      <input id="opacity" type="range" min="25" max="100" value="100" aria-label="Pin opacity" />
      <output id="opacity-value" for="opacity">100%</output>
      <button id="copy" title="Copy original image (Ctrl/Cmd+C)">Copy</button>
      <button id="close" aria-label="Close pin" title="Close pin (Esc)">×</button>
    </header>
    <main><img id="image" alt="Pinned screenshot" draggable="false" /></main>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="/pin.ts"></script>
  </body>
</html>
