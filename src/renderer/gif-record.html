<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Capturo GIF Recording</title>
  </head>
  <body>
    <div id="bar" class="record-bar">
      <span class="rec-dot" id="dot"></span>
      <span id="timer" class="rec-timer">0:00</span>
      <span id="frames" class="rec-frames">Preparing…</span>
      <span class="rec-spacer"></span>
      <button id="pause" class="app-action" data-action-icon="pause" aria-label="Pause recording" title="Pause recording" disabled></button>
      <button id="stop" class="app-action" data-action-icon="stop" data-action-tone="transition" aria-label="Stop and open preview" title="Stop recording and review the GIF" disabled></button>
      <button id="cancel" class="app-action" data-action-icon="cancel" data-action-tone="cancel" aria-label="Discard recording" title="Discard recording (Esc)"></button>
    </div>
    <video id="video" muted playsinline></video>
    <script type="module" src="./gif-record.ts"></script>
  </body>
</html>
