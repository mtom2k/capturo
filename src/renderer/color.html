<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Capturo Color</title>
  </head>
  <body class="color-body">
    <div id="preview" class="color-preview">
      <button id="pick-again" class="app-action preview-action" data-action-icon="pick" data-action-tone="transition" type="button" aria-label="Pick another color" title="Pick another color from the screen"></button>
    </div>

    <div class="color-body-inner">
      <div class="value-row">
        <input id="value" class="value-field" aria-label="Color value" spellcheck="false" autocomplete="off" />
        <div class="select-wrap">
          <select id="format" aria-label="Color format">
            <option value="hex">HEX</option>
            <option value="rgb">RGB</option>
            <option value="hsl">HSL</option>
          </select>
        </div>
        <button id="copy" class="app-action" data-action-icon="copy" data-action-tone="copy" type="button" aria-label="Copy color" title="Copy (Ctrl/Cmd+C)"></button>
      </div>

      <div class="slider-grid">
        <label class="slider-label" for="hue">Hue</label>
        <input id="hue" class="color-slider" type="range" min="0" max="360" step="1" />
        <output id="hue-value" class="slider-value" for="hue">0</output>

        <label class="slider-label" for="saturation">Saturation</label>
        <input id="saturation" class="color-slider" type="range" min="0" max="100" step="1" />
        <output id="saturation-value" class="slider-value" for="saturation">0</output>

        <label class="slider-label" for="lightness">Lightness</label>
        <input id="lightness" class="color-slider" type="range" min="0" max="100" step="1" />
        <output id="lightness-value" class="slider-value" for="lightness">0</output>

        <label class="slider-label" for="alpha">Alpha</label>
        <input id="alpha" class="color-slider alpha-slider" type="range" min="0" max="100" step="1" />
        <output id="alpha-value" class="slider-value" for="alpha">100</output>
      </div>

      <dl class="readouts">
        <div class="readout"><dt>HEX</dt><dd id="readout-hex">#000000</dd></div>
        <div class="readout"><dt>RGB</dt><dd id="readout-rgb">0, 0, 0</dd></div>
        <div class="readout"><dt>HSL</dt><dd id="readout-hsl">0, 0%, 0%</dd></div>
      </dl>

      <div class="palette">
        <div class="palette-head">
          <span id="palette-name" class="palette-name">Color</span>
          <span class="palette-hint">Similar colors · click to use</span>
        </div>
        <div id="swatches" class="swatches" role="list" aria-label="Similar colors"></div>
      </div>
    </div>

    <div id="status" class="color-status" role="status" aria-live="polite"></div>

    <script type="module" src="./color.ts"></script>
  </body>
</html>
